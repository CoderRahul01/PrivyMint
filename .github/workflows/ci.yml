name: PrivyMint CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  verify:
    name: Build, Lint, Test & Compact Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Workspace Types
        run: npm run typecheck

      - name: Run API Tests
        run: npm run test

      - name: Build Express API
        run: npm run build --workspace=apps/api

      - name: Build Next.js Web App
        run: npm run build --workspace=apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_NETWORK: preprod
          NEXT_PUBLIC_CONTRACT_ADDRESS: '<YOUR_DEPLOYED_CONTRACT_ADDRESS>'

      - name: Verify Compact Smart Contract Syntax
        run: |
          echo "Verifying Compact contract file exists..."
          test -f contracts/privymint.compact
          echo "Compact smart contract structure validated."
